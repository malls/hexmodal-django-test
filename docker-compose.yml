# AI written
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hexmodal}
      POSTGRES_USER: ${POSTGRES_USER:-hexmodal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexmodal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexmodal} -d ${POSTGRES_DB:-hexmodal}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-hexmodal}
      POSTGRES_USER: ${POSTGRES_USER:-hexmodal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexmodal}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./app:/app
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
